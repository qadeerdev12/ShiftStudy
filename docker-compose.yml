# Local dependencies: SQL Server, Redis, Azurite (blob storage emulator).
# Not needed until Course 6 (database) / Course 9 (cache). Run with: docker compose up -d
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}"
    ports: ["1433:1433"]
    volumes: [sqldata:/var/opt/mssql]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports: ["10000:10000"]
volumes:
  sqldata:
